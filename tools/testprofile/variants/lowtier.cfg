# What a weak machine gets: the minimal whole-map tier, a small far-memory budget and small point-light shadow maps.
[WorldLod]
# task 0066 stage e: the weakest hardware tier.
tier = minimal
# task 0060: what the far object clusters may hold, in MiB; clusters beyond it wait and the live objects draw instead.
far memory budget = 24

[Shadows]
# task 0077: the weak tier's face size (the default is 512).
point light shadow resolution = 256
