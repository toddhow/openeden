# A small simulated card for the video memory scale-back: the far field is held to a small budget so that the steps show.
[WorldLod]
# task 0080: the low tier evicts far clusters, so a lower budget really frees memory (the high tier keeps what has no
# fallback).
tier = low

[VideoMemory]
# task 0080: a card of 225 MiB (times budget fraction), pressure from what the renderer itself counts (the driver's
# number does not fall after a step: VSG's pools keep freed memory).
budget = 225
usage source = ledger
