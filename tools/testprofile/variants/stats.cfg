# Measuring aids (they cost a little): per-frame counters and the cell-load trace. For use with OPENEDEN_FRAME_STATS_FILE.
[Rendering]
# task 0054: process memory, device memory, loaded cells and a census of the scene graph as columns of the frame stats file.
frame counters = true

[Cells]
# task 0060: times every part of every cell load; writes load-trace.jsonl to the user folder at exit.
load trace = true
