# Multisampling instead of TAA. TAA refuses to run with MSAA (it logs a warning), so the two are separate variants.
# Use it to compare the edge quality and the cost of the two, or when TAA ghosting bothers you.
[Video]
antialiasing = 4

[Rendering]
# task 0075: off in this variant; with it on the log would say "taa needs a single-sampled scene".
taa = false
