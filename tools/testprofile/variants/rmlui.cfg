# task 0104 (decision 0015, UI system U1): OpenEden's new UI (RmlUi) drawn over the game. A small debug panel at the top
# left: the title "OpenEden UI", a frame rate line and a short list, in the game's own bitmap font. No input reaches it
# yet. A variant and not part of profile.cfg: it is a test panel that would sit on screen in every normal session.
[GUI]
rmlui = true
# task 0111 follow-up: the gamepad-only way into the panel. Back (Select) or F9 moves the controller focus into the panel and
# out of it again (only while the game shows its cursor, in a menu or window); then the d-pad moves between the buttons.
rmlui focus button = back
rmlui focus key = F9
