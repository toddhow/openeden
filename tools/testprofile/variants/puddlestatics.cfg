# Puddle map with static surfaces (task 0095, stage W-c): the bake also takes the roads, paving, decks and floors of the
# exterior statics, so on the object shader a road collects water in its own dips and is dry where it slopes. The bake
# walks the player through every cell with references and casts a ray at every texel, which takes long (minutes to an
# hour for the whole of Morrowind; the captures are kept and reused). Look at the Seyda Neen road and the paving of
# Vivec or Balmora in rain, and `wetness puddle debug = statics` to see which columns the map holds a surface in.
[Rendering]
puddle bake statics = true
