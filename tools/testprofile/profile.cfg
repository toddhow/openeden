# OpenEden living test profile: every finished feature switched on, in one combination that is meant to run stable.
# tools/testprofile/prepare.sh merges this file into a COPY of your settings.cfg (a key already there is replaced, every
# other line of yours stays). One section per settings.cfg section; each line says which task added the setting and what
# it shows. Settings that exclude each other live in variants/<name>.cfg (see README.md).
#
# Rule (root CLAUDE.md): a task that adds a user-visible setting adds it here (or to a variant, or to exclude.txt with a
# reason) in the same change; tools/testprofile/coverage.sh fails otherwise. Check every name against
# files/settings-default.cfg and the prerequisites named in its comment.
#
# Debug views (gbuffer debug view, wetness debug, cover debug, cloud shadow debug, sun glow debug, volumetrics debug,
# volumetric clouds debug, gi debug, ao temporal debug, taa debug, lightning debug age) stay at their defaults (off): they
# replace the picture. Switch one on by hand when a README line says so.

[Video]
# task 0075: temporal anti-aliasing refuses multisampling, so the profile uses no MSAA. variants/msaa.cfg swaps the two.
antialiasing = 0

[Rendering]
# task 0023: write the median and 95th percentile GPU time of each render pass to the log (openmw.log) when the game exits.
gpu timing = true
# task 0023: write what the machine's Vulkan supports to the log and to device-report.json in the user folder at start.
device report = true
# 2026-11-09: the driver's compiled pipelines are kept between runs (on by default; the first run after a driver update still compiles them all).
pipeline cache = true
# task 0072: shaders written in Slang in place of their GLSL twins (the sun, sky, terrain, water, objects, GUI, compute
# passes). Their first compile stalls the game for a few seconds on a cold cache. variants/glsl.cfg turns it off.
slang shaders = true

# task 0025: linear HDR path. Every effect below needs it.
hdr = true
# task 0025: bloom; the sun and the torches glow. The tonemap stays "vanilla" (variants/aces.cfg tries the other curve).
hdr bloom = true
# task 0026: stored normals, linear depth and velocity for the passes below (needs hdr).
gbuffer = true
# task 0027: material model and physically based lighting (needs hdr). "physical": every surface reflects.
pbr = true
pbr look = physical
# task 0044: read <texture>_rmaos / _orm packed material maps (and _n on the terrain) next to each texture. A stock
# Morrowind has none of these files: it shows only with a texture pack such as Faultier's.
pbr material maps = true
# task 0045: parallax occlusion from <texture>_p height files; also needs a texture pack. A surface without a height file
# is unchanged.
parallax = true
# task 0028: ambient light from baked light probes in interiors (needs hdr and pbr). prepare.sh bakes "Caldera, Guild of
# Mages" and "Seyda Neen, Arrille's Tradehouse"; any other interior keeps the cell's flat ambient colour until you
# bake it (openmw --bake-gi "<cell>").
gi = true
# task 0036: ambient light for exteriors from a baked sky-visibility field (needs hdr, pbr and atmosphere). prepare.sh
# bakes the cells around Seyda Neen (-3,-10 to -1,-8).
gi exterior = true
# task 0029: ambient occlusion in creases and corners (needs hdr, gbuffer and pbr).
ao = true
# task 0048: the terrain takes occlusion too (needs ao).
ao terrain = true
# task 0076: the occlusion is averaged over frames instead of staying a fixed noise pattern (needs ao).
ao temporal = true
# task 0033: subsurface scattering on skin (needs hdr, gbuffer and pbr).
sss = true
# task 0075: temporal anti-aliasing (needs hdr, gbuffer and [Video] antialiasing = 0). Rain, snow and other blended draws are drawn after the resolve (task 0075, transparents).
taa = true
# task 0034: sky, sun, cloud and fog colours follow the height of the sun (needs hdr).
atmosphere = true
# task 0047: the sun as a computed disc with a glow (needs hdr and the Slang shaders).
procedural sun = true
# task 0038: the sky's cloud layers are lit by the sun (needs hdr) ...
clouds = true
# task 0038: ... and cast shadows on the ground (needs hdr and atmosphere).
cloud shadows = true
# task 0042: ray-marched volumetric clouds, replacing the vanilla cloud layers in fair weather (needs hdr and atmosphere;
# one of the two heaviest GPU effects).
volumetric clouds = true
# task 0042: the clouds reach the horizon (the vanilla cloud dome leaves a clear band above it), the layer curves round a
# planet so low rays meet it, and the cloud noise repeats less (each needs volumetric clouds).
volumetric clouds horizon = true
volumetric clouds curved layer = true
volumetric clouds variety = true
# task 0079: a second, high cloud layer of thin fibrous streaks (cirrus) above the others; none in overcast, rain, storms,
# fog or snow (needs hdr and atmosphere).
cirrus = true
# task 0041: volumetric fog and light shafts (needs hdr; shafts need [Shadows] enable shadows; the heaviest GPU effect).
volumetrics = true
# task 0037: rain wetness and puddles (needs hdr and pbr).
wetness = true
# task 0095: the terrain's puddles sit where water collects, from the map `openmw --bake-puddles` bakes (needs wetness; without
# the pack the noise puddles stay). Objects keep the noise puddles.
wetness puddle map = true
# task 0039: snow and ash cover on upward-facing surfaces (needs hdr and pbr).
cover = true
# task 0040: rain and snow lit by the scene, longer streaks for fast rain (needs hdr).
precipitation lighting = true
# task 0040: a thunderstorm's flash is a light that also tilts the sun's shadows (needs hdr; capped for photosensitivity).
lightning = true
# task 0040: a warm halo round the sun in haze and fog (needs hdr and atmosphere).
sun glow = true

[Shadows]
# task 0052: shadow maps for the sun, with all four caster kinds (object shadows used to crash the game, now fixed).
enable shadows = true
object shadows = true
terrain shadows = true
actor shadows = true
player shadows = true
# task 0077: shadows from the nearest torches, candles and lanterns (needs hdr, gbuffer and pbr; refused with [Shaders]
# classic falloff). The four caster settings above decide what casts.
point light shadows = true
# task 0077: how many point lights cast at once (the nearest and largest), the texels along a face of each light's shadow
# map (256 is the weak tier, variants/lowtier.cfg), the filter taps and the bias scale (the defaults, written out).
point light shadow count = 4
point light shadow resolution = 512
point light shadow filter taps = 8
point light shadow bias = 1.5
# task 0077: keep the point light shadow maps between frames and redraw a face only when the light, a nearby actor or
# door, or the loaded cells changed (or the face is old); the flicker never redraws. Refresh faces: stale faces drawn a
# frame at most; refresh frames: the age at which a face is drawn anyway (the defaults, written out).
point light shadow cache = true
point light shadow refresh faces = 6
point light shadow refresh frames = 24

[Terrain]
# World LOD needs distant terrain.
distant terrain = true

[WorldLod]
# task 0055: baked terrain tiles (prepare.sh bakes terrain.edenpak).
enabled = true
# task 0066: the whole-map view: tiles and clusters out to the reach of the loaded land, with aerial haze. It costs
# 100 to 450 MiB of memory (README, known limits).
map view = true
# task 0087: terrain tiles dither in and out over 0.4 s when they appear, are replaced or are handed to the live terrain
# (0 is the old instant swap, to compare).
terrain fade time = 0.4
view distance = auto
# task 0059: baked object clusters for the far field (prepare.sh bakes objects.edenpak).
object clusters = true
# task 0096 stage b: far lava planes, waterfalls and the Ghostgate fence scroll like the near ones (prepare.sh bakes the
# scroll into objects.edenpak as layout version 2 when these two are on; inert activators join the clusters).
object cluster effects = true
object cluster scenery = true
# task 0096 stage c: far trees and other foliage sway in the wind (the bake marks the models by name; re-bake the objects).
object cluster sway = true
# task 0096 stage c: the sway grows with the distance (1 to 6 times) so that far trees visibly move.
object cluster sway distance boost = true
# task 0066 stage c: aerial perspective in place of the linear fog end.
haze = true
# task 0066 stage e: the hardware tier is chosen from the device report; variants/lowtier.cfg forces the weakest.
tier = auto

[VideoMemory]
# task 0080: the video memory scale-back. With the driver's own budget a 12 GiB card never reaches it; variants/vramsmall.cfg
# simulates a small card. Reduces the far field's live budgets (far objects, far terrain) and, last, the top mip levels of textures of 2048 and up (texture mips, task 0080 stage d) when memory runs high.
enabled = true
order = far objects, far terrain, texture mips
# One summary line at exit (steps taken, time at each level).
report = true

[Bodies]
# task 0069: the stock body parts of a race and sex welded into one skinned mesh (prepare.sh bakes the cache). An actor
# whose cache entry is missing or stale draws the stock parts.
merged body = true

[Cells]
# task 0060 stage g: new cells at a border crossing are built a few milliseconds a frame instead of in one frame.
incremental cell build = true

[Game]
# Inherited from OpenMW 0.51 (Jolt branch): draw holstered weapons and shields. Needs modded assets; with plain Morrowind
# nothing changes.
weapon sheathing = true
shield sheathing = true
# task 0011 (M9): the actor's hitbox follows its body in several segments; foot planting, gaze and smoother turns are
# the M9 animation features.
actor collision shape type = 4
foot planting = true
# task 0108: hold a planted foot while the actor stands still; the stop no longer glides the stance foot back to idle
foot lock = true
look at = true
smoother turns = true
# Inertial locomotion (M9/M10): the player gets momentum, acceleration curves and skids; high is the strongest preset.
inertial locomotion = high
inertial locomotion npcs = true
# task 0108: the body follows the walk clip's own root speed within a step, so a planted foot does not skate
inertial stride sync = true
# task 0017 (W3): lines drawn from the extension debug draw service, and per-extension timings in the debug window
# (F10, Extensions tab). With no extension enabled there is nothing to see; enable one in openmw.cfg (extension=example).
extension debug draw = true
extension profiler = true
# task 0103 (neutral world model N3a-1): builds the core's neutral world store and lets a game pack register its world
# source in it. Work in progress: with Morrowind (the default game) nothing registers and nothing changes; with
# game=skyrimse the Skyrim SE pack no longer ends the session. Nothing reads the store yet.
neutral world = true
# Torso lean and bank from acceleration.
procedural lean = true
# task 0067: the "natural" preset switches on, together, CreativeMotion's pose driver, the transition rules, the style
# layer and the intent rules. A creativemotion animation = false in your own settings.cfg would win over the preset, so
# the profile also writes the pose driver's switch.
creativemotion preset = natural
creativemotion animation = true

[Physics]
# task 0035: allows the cmRagdoll and cmRagdollOff console commands (a limp CreativeMotion ragdoll).
# task 0106: also, a non-player NPC that dies in your view falls as a CreativeMotion ragdoll in the game's Jolt world and the
# skeleton follows it (up to 8 at once; the corpse's pick and loot box stay where it died).
creativemotion ragdolls = true
