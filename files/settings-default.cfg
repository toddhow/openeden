transparent postpass = true

[Rendering]

# openeden: measure how long each render pass takes on the GPU, with Vulkan timestamp queries. Writes the median and 95th
# percentile of each pass to the log when the game exits and, when the environment variable OPENEDEN_FRAME_STATS_FILE
# names a file, one column per pass to that file. Off: no query pool is created and nothing is recorded.
gpu timing = false

# openeden: use the shaders that are written in Slang (compiled to SPIR-V when the game is built) in place of their GLSL
# versions. Only the sun so far. Off: the GLSL shaders are used. Ignored (the GLSL is used) if the build has no
# Slang shaders.
slang shaders = false

# openeden: write a report of what the machine's Vulkan supports to the log and, as device-report.json, to the user data
# folder, when the game starts.
device report = false

# openeden: keep the graphics driver's compiled pipelines in <user data>/openeden/shadercache between runs, so the driver does not
# recompile the same shaders on the main thread every start. Needs the VSG pipeline cache patch (always applied by the build).
pipeline cache = true

# openeden: add columns to the file named by the environment variable OPENEDEN_FRAME_STATS_FILE (task 0054): the process memory,
# the device memory in use, the loaded exterior cells and a census of the scene graph (draw commands and triangles with
# no culling, so an upper bound). For measuring only. Off: the file is exactly as without it.
frame counters = false

# openeden: render the scene in 16-bit floating point and in linear light, then apply exposure, a tonemap and optional
# bloom on the way to the screen (task 0025). Takes effect at start. Off: the renderer is exactly as without it.
hdr = false

# openeden: the tonemap curve of the HDR path: vanilla (clip at 1, nearest to the picture without HDR), reinhard or aces.
hdr tonemap = vanilla

# openeden: exposure of the HDR path in stops (EV), from -8 to 8. Each stop doubles the brightness.
hdr exposure = 0.0

# openeden: bloom of the HDR path.
hdr bloom = false

# openeden: how much of the bloom is added to the picture, from 0 to 1.
hdr bloom strength = 0.05

# openeden: keep the opaque scene's view-space normals and linear depth (and, in later stages, screen motion) as images
# that later passes can read (task 0026). Takes effect at start and only with hdr on. Off: the renderer is exactly as
# without it.
gbuffer = false

# openeden: draw one of the stored images in place of the scene, to look at it: none, normals, depth, velocity,
# roughness, material (red metalness, green reflectance, blue occlusion) or subsurface (white where a surface is marked
# as skin). Only with gbuffer on (roughness, material and subsurface also need pbr).
gbuffer debug view = none

# openeden: the material model and physically based lighting (task 0027). Every surface gets a roughness, metalness,
# reflectance, occlusion and subsurface mark (derived, from material files, or from optional textures) and is lit with
# a microfacet specular. With gbuffer on the values are also stored for later passes. Takes effect at start and only
# with hdr on. Off: the renderer is exactly as without it.
pbr = false

# openeden: how physically based lighting looks: vanilla (the diffuse light of Morrowind kept, specular only where a
# surface has specular data) or physical (every surface reflects, diffuse is energy conserving). Only with pbr on.
pbr look = vanilla

# openeden: also read a packed material texture next to each diffuse texture. <diffuse name>_rmaos is the True PBR
# layout (red roughness, green metalness, blue occlusion with black = occluded, alpha specular, task 0044) and is looked
# for first; <diffuse name>_orm has occlusion in red, roughness in green and metalness in blue (a proposal, task 0027).
# Terrain layers read them too, together with <diffuse name>_n normal maps, and are lit with the material model. Only
# with pbr on.
pbr material maps = false

# openeden: parallax occlusion mapping (task 0045): a surface with a True PBR height file next to its texture
# (<diffuse name>_p, one channel, 1 = the top; an object also needs its <diffuse name>_n normal map for the tangent
# frame, which is looked for next to a height file whatever the [Shaders] settings say) is drawn with depth: each pixel
# follows the view ray down into the height field and reads the texture where it meets it. Terrain layers read their
# _p file too (the files of all layers must have one size and format, such as the 256 level of a 4k file; a layer's
# displacementScale needs pbr on, for the material table). Takes effect at start. Surfaces without a height file, and
# the older parallax from a normal map's alpha, are as before. The depth
# is not in the depth buffer: outlines stay flat. Off: the renderer is exactly as without it.
parallax = false

# openeden: how many steps along the ray: low (8 to 12), medium (10 to 20) or high (16 to 32), more at grazing angles.
parallax quality = medium

# openeden: a multiplier of every material's depth (0 to 4). The depth of a material is its displacementScale in an
# openeden/materials/*.json file (default 0.5, the value of Faultier's stone wall; reading the files needs pbr on). 0 is
# as 0.001: a very shallow surface.
parallax scale = 1.0

# openeden: drop pixels whose displaced texture coordinates leave the texture. Only for objects whose texture is
# clamped (signs, banners: the edge would otherwise smear); tiling textures and the terrain never discard.
parallax discard edges = false

# openeden: runtime texture downscaler (task 0049). No texture of a model or the terrain is uploaded larger than this
# many texels on its longest side (a power of two from 16 to 8192; 0 = no limit). A texture with a mip chain simply
# loses its top levels, which is exact and costs nothing; one without a chain (TGA, PNG, some DDS) is shrunk by
# averaging; a block compressed (DXT/BC) texture with no chain cannot be shrunk and stays full size (see the report).
# Nothing is edited on disk. The UI, the HUD, the sky and the water are never touched. Takes effect at start.
# 0 everywhere: nothing changes.
texture max size = 0

# openeden: the limit for the terrain's land textures and for models, in place of texture max size (0 = use that one).
# With its mip chain a BC7 texture takes about 1.33 bytes per texel (BC1: 0.67), so a limit of 2048 costs about four
# times the memory of 1024.
texture max size terrain = 0
texture max size objects = 0

# openeden: off, auto or a number of MiB (as auto, but as if the card had that much device local memory, to see what a
# smaller card would get; 4096 is a 4 GiB card). auto picks the two limits above from the graphics card's memory
# (device local heaps): under 3 GiB objects 512 and terrain 256, 3 to 6 GiB 1024 and 512, 6 to 10 GiB 2048 and 1024, over
# 10 GiB objects unlimited and terrain 2048. These numbers are a first guess. A limit set above wins when it is smaller;
# auto never raises it.
texture memory budget = off

# openeden: write one line to the log at exit saying how many textures were made smaller and how many bytes that saved.
texture downscale report = false

# openeden: ambient light from baked light probes (task 0028). An interior with a bake file (openeden/probes/ in the
# data folders, written by openmw --bake-gi) takes its ambient light from the probes in place of the cell's one flat
# colour; interiors without a file are as before. Takes effect at start and only with hdr and pbr on. Off: the renderer
# is exactly as without it.
gi = false

# openeden: ambient occlusion: darkens the ambient part of the light in creases and corners, from the stored depth and
# normals (half resolution, filtered). Takes effect at start and only with hdr, gbuffer and pbr on. Off: the renderer is
# exactly as without it. Radius in game units (about 70 per metre), strength 0 to 4 (1 is the plain value), the slice
# directions and the steps along each side of a slice per pixel.
ao = false
ao radius = 100
ao strength = 1
ao slices = 2
ao steps = 6

# openeden: ambient occlusion on the terrain (task 0048): with ao on, the ground is darkened like every other surface (at
# the base of walls, rocks and cliffs, in hollows). Takes effect at start and only with ao on. Off: the terrain takes no
# occlusion, as before.
ao terrain = false

# openeden: temporal accumulation of the ambient occlusion (task 0076): the occlusion's sample directions change every
# frame and the results are averaged over frames (reprojected by the motion image, dropped where the surface is another
# one by its stored depth and normal), so the occlusion converges instead of staying a fixed noise pattern. Takes effect
# at start and only with ao on; works with and without taa. Off: the renderer is exactly as without it. history is the
# weight the average settles at (0.5 to 0.98, higher is smoother and lags more when something moves), clamp limits the
# history to the range of the neighbouring samples in standard deviations (a variance box, Salvi 2016, covered by a patent:
# default 0 = no limit, up to 4), debug is none, raw (the
# unaccumulated value of the frame), weight (the history's share), reject (the share of the history thrown away) or static
# (no change of directions, no history: the plain pass), shown by gbuffer debug view = ao.
ao temporal = false
ao temporal history = 0.9
ao temporal clamp = 0
ao temporal debug = none

# openeden: subsurface scattering on skin (task 0033): light spreads a little under the skin of people and creatures the
# material model marks as skin, red farther than green and green farther than blue, from the stored depth and normals.
# Takes effect at start and only with hdr, gbuffer and pbr on. Off: the renderer is exactly as without it. Strength 0 to 1
# (0 is none, default 0.8), width in game units (about 70 per metre) of the red channel's spread (default 1.0). The defaults
# were raised from 0.5 and 0.7 after frames (decision 0010 answer 5). A texture named for eyes is never marked as skin.
sss = false
sss strength = 0.8
sss width = 1.0

# openeden: temporal anti-aliasing (task 0075): the picture is drawn with a different sub-pixel shift every frame and each
# frame is blended with the previous one (moved to where each surface was), which smooths edges and fine detail without
# the cost of multisampling. Takes effect at start and only with hdr and gbuffer on and [Video] antialiasing = 0 (it is
# left off, with a message in the log, with multisampling). Off: exactly as without it. Sharpness 0 to 1 is a mild
# sharpen of the shown picture (never of the stored history); jitter scale 0 to 1 scales the shift (0: none, so no edge
# smoothing, only a stable picture); history is the share of the previous frame in the result (0.5 to 0.98, default 0.95); clipping is
# "minmax" (default: the neighbourhood's smallest and largest colour) or "variance" (a box from its mean and spread; covered
# by US10116916B2, so an opt-in); clip gamma
# is the variance box's width in standard deviations (0.5 to 4; larger keeps more history and ghosts more); debug is
# "none", "weight", "reject" or "velocity" (a diagnostic picture in place of the scene).
taa = false
taa sharpness = 0.25
taa jitter scale = 1.0
taa history = 0.95
taa clipping = minmax
taa clip gamma = 1.0
taa debug = none

# openeden: atmosphere (task 0034): the colours of the sky, the sun and ambient light, the clouds and the fog follow from the
# height of the sun (light scattered by air), blended with the weather's own colours. The weather itself (its choice,
# transitions, sounds, scripts and weather records) is not touched, and a weather with no sun glare (fog, ash, blight)
# and the night keep the weather's colours exactly. Takes effect at once, and only with hdr on. Off: exactly as without it.
# The look is "vanilla" (the weather's brightness and half the hue of the model) or "physical" (the model's colours on clear
# days).
atmosphere = false
atmosphere look = vanilla

# openeden: with the atmosphere on, take the sun's height for the sky colours from the hour of Morrowind's colour tables
# instead of from the drawn sun (decision 0010 answer 4). The tables show their sunset colours at the middle of the
# sunset window of the Sky colour table (about 18:30 with the usual INI values) while the drawn sun sinks until 20:00, so by the drawn sun the sunset
# colours would come an hour or more late. On: the sky is at its sunset at the tables' sunset. The drawn sun, the light
# direction and the shadows do not move either way, only colours. Off: the height of the drawn sun, as in the first
# version of the atmosphere. Only has an effect with atmosphere on.
sun follows colour tables = true

# openeden: the sun as a computed disc (task 0047) in place of the texture tx_sun_05.dds: a disc with a darker rim and a
# soft edge, and a two part glow that fades smoothly, with a brightness above white (an HDR intensity, so bloom can
# treat it as a light). Its colour is the weather's sun colour (so it follows the atmosphere when that is on). Takes
# effect at start and only with hdr on (and a build that has the Slang shaders); otherwise the textured sun is drawn. The
# sun stays where Morrowind puts it, and the occlusion test, flash and glare overlay are unchanged. Off: exactly as
# without it. Size scales the disc (0.25 to 2.5), intensity is how many times white the disc is (1 to 100), glow scales
# the halo (0 to 4).
procedural sun = false
procedural sun size = 1
procedural sun intensity = 30
procedural sun glow = 1

# openeden: scales the baked ambient light (0 to 2) when gi is on.
gi strength = 1

# openeden: scales the reflections of baked reflection probes on metals and shiny surfaces (0 to 2; 0 is off). They come
# from a file beside the light probes' file, made by the same baker; without one nothing changes.
gi reflection strength = 1

# openeden: when gi is on, draws a small octahedron at every loaded light probe (coloured by the ambient light it gives
# an upward facing surface) and a larger one at every reflection probe.
gi debug = false

# openeden: the light probe baker (openmw --bake-gi "<interior cell>"): rays shot from each probe, bounces of light,
# the distance between probes in game units, the random seed, and how many milliseconds of each frame the baker may use.
gi bake rays = 256
gi bake bounces = 2
gi bake spacing = 128
gi bake seed = 1
gi bake budget ms = 20

# openeden: the baker's reflection probes: the most to place (0 bakes none), rays averaged per texel, and the width of
# each probe's map in texels (8, 16, 32 or 64).
gi bake reflection probes = 8
gi bake reflection samples = 4
gi bake reflection resolution = 32

# openeden: ambient light for exteriors (task 0036): where a cell has a sky visibility file (openeden/probes/exterior/ in
# the data folders, written by openmw --bake-gi-exterior "<x>,<y>"), the flat ambient light is scaled by how much of the
# sky each place sees, in the colour of the live sky, so it is darker under bridges, trees and eaves and between
# buildings. Open ground keeps the flat ambient exactly. Takes effect at start and only with hdr, pbr and atmosphere
# on. Off, or with no file for a cell: exactly as without it. Strength 0 to 2 (1 is the plain value; the default 0.6 is
# toddhow's choice, decision 0010 answer 2, because 1 was too dark).
gi exterior = false
gi exterior strength = 0.6

# openeden: rain wetness and puddles (task 0037). While the weather has rain (rain, thunderstorm) outdoor surfaces get
# darker and glossier, flat ground collects puddles that mirror the sky with ripples, and the ground stays damp for
# `wetness dry time` seconds of game time after the rain (900 is a quarter of an hour; a chosen value, no source).
# Places under cover stay dry only where a cell has a sky visibility file (gi exterior). Takes effect at start and only
# with hdr and pbr on. Off, or in dry weather: exactly as without it. Strength 0 to 1. `wetness debug` shows wetness
# (red), cover (green) and puddles (blue) instead of the picture.
wetness = false
wetness strength = 1
wetness puddles = true
wetness dry time = 900
wetness debug = false

# openeden: snow and ash cover (task 0039). While it snows (snow, blizzard) or ash falls (ash storm, blight), surfaces
# that face up gather a layer of snow (bright white) or ash (dark grey) with a ragged edge; walls and places under a
# roof stay clear (the roof test needs gi exterior and a baked cell, as for wetness). It builds over `cover build time`
# seconds of game time of steady weather (1200 is twenty game minutes) and snow melts over `cover melt time` seconds
# after (7200 is two hours); ash fades four times slower. Both are chosen values, no source. Takes effect at start and
# only with hdr and pbr on. Off, or in other weather: exactly as without it. Strength 0 to 1. `cover debug` shows cover
# (red), upwardness (green) and the covered share (blue) instead of the picture.
cover = false
cover strength = 1
cover build time = 1200
cover melt time = 7200
cover debug = false

# openeden: cloud shading and cloud shadows (task 0038). `clouds` lights the sky's two cloud layers by the sun: thick parts
# are darker underneath, thin edges towards the sun glow (a silver lining), by the picture's alpha and brightness; storms
# (ash, blight, blizzard) keep their look and the night is unlit. `clouds look` is `lit` or `flat` (the vanilla picture).
# `cloud shadows` darken the direct sun on the ground where a cloud stands between the sun and the ground, from the same
# picture and scroll as the sky, by `cloud shadow strength` (0 to 1; 0.75 is a chosen value, no source). `cloud shadow
# debug` shows only the shadow of the clouds, ignoring the sun's shadow maps. Both read at start; `clouds` needs hdr, shadows
# need hdr and atmosphere. Off: exactly as without them.
clouds = false
clouds look = lit
cloud shadows = false
cloud shadow strength = 0.75
cloud shadow debug = false

# openeden: weather effects (task 0040). `precipitation lighting` lights the rain by the scene (the ambient light, the sun
# when you look towards it, and every lamp or torch near the streak; no fixed colour), fades far streaks out and draws
# fast rain longer, and tints snow by the ambient light and the sun. `lightning` makes a thunderstorm's flash a light:
# a cold white-blue flash with a double flicker that also tilts the sun's light towards a seeded direction in the clouds
# for the length of the flash (and so its shadows); the vanilla white flash is replaced. `lightning strength` (0 to 2, default 0.7: toddhow found 1 too bright, decision 0010)
# scales it, but no flash is ever brighter than the cap (the closest vanilla strike) and a flash never starts less than 1.5
# seconds after the last, whatever the setting (photosensitivity; see components/render/lightningmath.hpp). It is only
# outdoors. `lightning debug age` (-1 = off) holds one flash at that age in seconds, in any exterior weather: a test aid
# for frames. `sun glow` adds a warm halo round the sun in haze and fog (forward scattering), from the sun's colour, the
# fog and how hazy the weather is (clear weather has none); `sun glow strength` 0 to 2, `sun glow debug` shows only the
# halo. All read at start; precipitation lighting and lightning need hdr, sun glow needs hdr and atmosphere. Off: exactly
# as without them.
precipitation lighting = false
lightning = false
lightning strength = 0.7
lightning debug age = -1
sun glow = false
sun glow strength = 1
sun glow debug = false

# openeden (task 0041): volumetric fog and light shafts. `volumetrics` turns the fog into a 3D volume that light passes
# through (needs hdr; with `enable shadows` on the sun's shadows make shafts). `volumetrics quality` is low, medium or
# high (the froxel grid: 80x45x32, 160x90x64, 240x135x96; the heaviest GPU effect, see docs/research/0021-volumetrics-cost.md).
# `volumetrics density` scales the fog's thickness (1 = the weather's own fog), `volumetrics anisotropy` is the lobe of the
# scattering (-0.95 to 0.95; higher is brighter towards the sun), `volumetrics temporal` blends in the last frame's
# volume (not at low quality), `volumetrics debug` shows the scattered light of the volume alone. All read at start.
# Off: exactly as without it.
volumetrics = false
volumetrics quality = medium
volumetrics density = 1
volumetrics anisotropy = 0.6
volumetrics temporal = true
volumetrics debug = false

# openeden (task 0042): ray-marched volumetric clouds. `volumetric clouds` draws a layer of cloud 1500 to 4000 m up as a
# real volume (needs hdr and atmosphere; the heaviest GPU effect, see docs/research/0023-volumetric-clouds-cost.md). It
# replaces the vanilla cloud layers except in weathers that keep their own sky (ash, blight, blizzard, fog and snow).
# `volumetric clouds quality` is low, medium or high (march at 1/8, 1/4 or 1/2 of the screen; 24, 40 or 64 steps).
# `volumetric clouds coverage scale` and `volumetric clouds density` scale the weather's cloud cover (0 to 2) and the
# thickness (0 to 4). `volumetric clouds shadows` lets the clouds cast the ground shadows of `cloud shadows`.
# `volumetric clouds debug` shows `transmittance`, `shape`, `detail` or `curl` instead of the clouds (`none` for no debug).
# All read at start. Off: exactly as without it.
volumetric clouds = false
volumetric clouds quality = medium
volumetric clouds coverage scale = 1
volumetric clouds density = 1
volumetric clouds shadows = true
volumetric clouds debug = none

# openeden (task 0042, follow-up): the clouds' horizon, curve and variety (each off by default; they need `volumetric
# clouds`; all read at start). `volumetric clouds horizon` draws the volume down to the horizon: the vanilla cloud dome
# stops 5.7 degrees above it and fades out over the lowest 25, which leaves a clear band; with it on the dome is lowered
# below the horizon and its fade is not applied (the volume's own haze fades distant cloud). `volumetric clouds curved
# layer` makes the layer a shell around a planet of `volumetric clouds planet radius` kilometres (100 to 1000000;
# 6371 is the Earth), so rays just above the horizon meet it about sqrt(2 R h) away (140 km) instead of missing it; the
# ground shadows keep the flat layer. `volumetric clouds variety` moves the cloud noise sideways and the coverage by a
# very large scale noise, so the same 12 km pattern is not seen everywhere (it repeats every 84 km instead of 12).
volumetric clouds horizon = true
volumetric clouds curved layer = false
volumetric clouds planet radius = 6371
volumetric clouds variety = true

# openeden (task 0079): a second, high cloud layer (cirrus): thin, fibrous streaks computed from noise on a dome of their
# own, above the other cloud layers. They drift with a wind faster than the low clouds' and a little turned from it, thin
# out as the weather's low clouds thicken (none in overcast, rain, storms, fog or snow), stay lit by the sun for a few
# degrees after the ground is dark (pink at dusk) and cast no shadow. Needs hdr and atmosphere and a build with the Slang
# shaders (otherwise a log line and nothing changes). `cirrus coverage` scales how much of the sky they cover (0 to 2),
# `cirrus opacity` how thick they are (0 to 1.5), `cirrus altitude` is their height in kilometres (6 to 12), `cirrus wind
# scale` multiplies the low layer's wind speed (0 to 20), `cirrus quality` is low, medium or high (3, 4 or 5 noise octaves
# and 0, 1 or 2 warps). `cirrus debug` shows `density`, `share`, `light` or `footprint` instead of the colour (`none` for
# no debug). All read at start. Off: exactly as without it.
cirrus = false
cirrus coverage = 1
cirrus opacity = 1
cirrus altitude = 9
cirrus wind scale = 6
cirrus quality = medium
cirrus debug = none

# openeden: the sky visibility baker: rays shot from each probe, and the distance between columns of probes in game units
# (a cell is 8192 units; the value is rounded to 128, 256, 512, 1024 or 2048).
gi bake sky rays = 256
gi bake sky spacing = 256

[WorldLod]

# openeden (task 0055): baked world LOD tiles. The tile layout is version 1 (approved 2026-11-02); a pack made with another
# layout version is refused and must be baked again. `enabled` turns the system on: with false no code of it runs, no file is opened
# and the game plays exactly as without it. The baker is `openmw --bake-lod-terrain`; its pack is
# <user data>/openeden/lod/terrain.edenpak (derived data, safe to delete).
enabled = false

# Largest error of a baked terrain tile on screen, in pixels, before the live terrain is used instead (a tile that was
# replaced returns below 0.7 of this). Calibrated default 8 (task 0055 S1f): the largest of 2, 4, 8, 16, 64, 256 whose frames at 30000 view stay within run-to-run noise; 2 and 4 are the design doc's high and medium.
# Range 0.01 to 1000000 (task 0090): a value outside it is cut to it, with no message. Very large values draw one tile
# over the whole world.
terrain tile threshold = 8

# openeden (task 0087): seconds a baked terrain tile takes to dither in or out when it appears, is replaced by finer or
# coarser tiles, or is handed to the live terrain, instead of changing in one frame (the stipple blends away with
# temporal anti-aliasing). 0 is the instant swap of before. Needs `enabled`.
# Range 0 to 60 seconds (task 0090): outside it is cut to it, with no message.
terrain fade time = 0.4

# The viewing distance, in units, while `enabled` is on and `[Terrain] distant terrain` is on: the larger of this and
# [Camera] viewing distance (fog, the far plane, terrain paging, object paging and the tiles all follow it), so far land
# is drawn out to the horizon without raising [Camera] viewing distance. With the system off nothing changes.
# `auto` (task 0066) means the reach of the loaded world's land: the diagonal of the box of its land cells, at most
# `max view distance`. It only takes effect with `map view = true`; without it `auto` counts as 40000. A number always
# overrides `auto` and is not capped by `max view distance`, but a number above 10000000 is cut to that with a warning
# (the largest reach that a float projection can still use). Text that is neither a number nor `auto` counts as 40000
# with a warning. A Lua `camera.setViewDistance` sets all the limits to its one number (the tile range, the paging
# range, the far plane and the fog end), which cancels `map view` and the haze until one of the settings above changes.
view distance = 40000

# Task 0066: whole-map view, off by default. Off: the tile range, the far plane, the fog end and the live terrain and
# object paging range are all the one number above (as before). On: the tiles and clusters are chosen out to `view
# distance` (or the land's reach with `auto`) and the far plane and the fog end follow that, while the live terrain and
# the distant objects keep paging at the old number (40000, or the number given). Needs `enabled` and
# `[Terrain] distant terrain`. The coarser baked levels and the aerial haze come in later stages of the task.
map view = false

# The most `view distance = auto` may reach, in units: a budget for weaker hardware, and it wins over the old 40000: with
# `map view` on, `auto` and a cap below 40000, both the tiles and the live paging range stop at the cap (never below
# [Camera] viewing distance). A number in `view distance` is not capped. Measured in the stage a log of task 0066 at
# 600000 (the whole Morrowind map is about 590000 across), which costs 6.9 GiB resident with today's levels.
# Range 1 to 10000000 (task 0090): outside it is cut to it, with no message.
max view distance = 600000

# Task 0066 stage c: aerial perspective with `map view`. On (default), land, objects, water and tiles fade into the air's
# colour by how much air the ray crosses: thick near the ground, thin at height, so from high up the whole map shows.
# Off: the linear fog end as before, which then sits at the far plane. Interiors and under water keep the linear fog.
haze = true

# The distance at which a horizontal ray along the ground keeps 10 percent of the light in clear weather, in units.
# Default 100000 (task 0066 stage c, chosen by eye: at 590000 the haze cannot be seen, at 100000 far ridges and the far sea
# pale into the sky from the ground and from 25000 units up, and a view along the ground is only lightly hazed).
# Range 1 to 10000000 (task 0090): outside it is cut to it, with no message.
haze visibility = 100000

# The height, in units, over which the air thins by a factor of e (the scale height). Starting value, tune by eye.
# Range 1 to 1000000 (task 0090): outside it is cut to it, with no message.
haze height = 4000

# How steeply weather thickens the air: the density is multiplied by exp(gain * (the weather's land fog depth - 0.7)),
# the excess limited to 0.42 (clear 0.69, rain 0.8, storm and fog 1.0, blizzard 2.8). Calibrated against vanilla's fog, whose
# full fog is at about the view distance (7168) in every weather. Gain 10 (task 0066) gave an ash storm a view of 1830
# units (the distance keeping 10 percent of the light along the ground) and hid all far land; toddhow lowered it to 3
# (task 0088, 2026-11-05): with the cap of 0.42 an ash storm, a blizzard or a night storm sees about 28000 to 30000
# units, a storm or fog (depth 1.0) about 40000, rain (0.8) about 74000, clear weather 100000.
# Range 0 to 100 (task 0090): outside it is cut to it, with no message.
haze weather gain = 3

# Task 0066 stage e: the hardware tier of the whole-map view, used only with `map view` on. auto picks it from the device
# report (device memory and system memory; a software device is always minimal); minimal, low, medium or high force one, to
# see what a weaker machine gets. A tier sets how many tile levels stay resident (`far levels`), the tile threshold (the
# larger of the tier's and `terrain tile threshold`), the cap of `view distance = auto` (the smaller of the tier's and
# `max view distance`), the size cap of far cluster pictures and a resident budget. Measured in the stage e log of task 0066.
tier = auto

# The highest terrain tile level drawn and kept resident with `map view` on (1 to 6; a level doubles the side of a tile).
# 0 means the tier's: minimal 3, low 4, medium 5, high 6. The packs are read only up to this level.
far levels = 0

# The longest side, in pixels, of the pictures of far object clusters (levels 3 and 4 gather thousands of statics and so
# hundreds of textures). 0 means the tier's. Rounded down to a power of two between 16 and 8192.
far texture max size = 0

# What the built far object clusters may hold in memory, in MiB as counted by the game (the vertex and index arrays and
# the decoded cluster: about a third of what the process's working set grows by). When it is reached, clusters that would
# go over wait and the live objects keep their cells, which costs draw calls: it is a safety valve, not a tuning knob. 0
# means the tier's. The terrain tiles drawn for the far field get a quarter of a number given here (their own budget, task 0060).
far memory budget = 0

# The finest baked level (1 is 2 x 2 cells). The baker always makes levels 1 to 3 (2 x 2, 4 x 4 and 8 x 8 cells); levels 2
# and 3 carry a baked ground picture, level 1 uses the live layers. Only 1 is accepted for now.
terrain tile level = 1

# openeden (task 0059): baked object clusters for the far field (towers, rocks, trees, buildings), DRAFT layout version 0.
# Needs `enabled`. The baker is `openmw --bake-lod-objects`; its pack is <user data>/openeden/lod/objects.edenpak. While
# a cluster is shown, the distant objects of its cells draw only activators and doors.
object clusters = false

# Largest error of an object cluster on screen, in pixels, before finer objects are used instead (the same maths as
# the terrain tiles). 8 starts level 1 at about 10,000 units at 720 p.
# Range 0.01 to 1000000 (task 0090): outside it is cut to it, with no message.
object cluster threshold = 8

# Seconds a cluster takes to dither in or out.
# Range 0 to 60 seconds (task 0090): outside it is cut to it, with no message.
object cluster fade time = 0.4

[Bodies]

# OpenEden AdvancedBodies (task 0069, stage d). Draw the merged body (the stock body parts of a race and sex welded into
# one skinned mesh by `openmw --bake-bodies`, kept in <user data>/openeden/bodies/ and never shared) instead of the
# stock parts. Off by default. With it on, an actor uses the merged body only when the cache is current for its race
# and sex (a load-order change or a replaced part makes it stale: re-run the bake) and nothing it wears replaces a
# merged slot; otherwise it draws the stock parts, as with this setting off. Head, hair, first person and werewolves
# always keep their parts.
merged body = false

[VideoMemory]

# openeden (task 0080): video memory scale-back. When the video memory the game holds nears the budget, the systems named in
# `order` are reduced one step at a time, the first listed first, and restored (last first) when memory allows. Off by default:
# with false no memory budget is read and nothing is measured or reduced. Read at start.
enabled = false

# `auto`: the driver's memory budget (VK_EXT_memory_budget) times `budget fraction`; without that extension, the device-local
# memory times it. A number of MiB simulates a card of that size.
budget = auto

# Where the video memory in use comes from: `driver` (what VK_EXT_memory_budget says this process uses) or `ledger` (only
# what the renderer itself counts; a diagnostic: the driver's number may not fall after a step because the memory pools
# keep freed memory).
usage source = driver

# The share of the budget the game may fill (the rest is left for the driver and the desktop). 0.1 to 1.
budget fraction = 0.85

# A step down is taken when the pressure (video memory held over the budget) stays above `high water` for two samples.
high water = 0.92

# A step is undone only when the pressure has been below `low water` for `restore dwell` seconds and undoing it, by its known
# cost, would still leave the pressure at least 0.05 under `high water`. Must be at least 0.30 under `high water`
# (clamped, with a warning, otherwise).
low water = 0.75

# The systems that may be reduced, first reduced first, last restored first. A system not listed is never touched. Known
# now: far objects, far terrain (the world LOD's live memory budgets, with `[WorldLod] map view`), texture mips (drops the top
# mip levels of textures of 2048 texels or more, never below 1024: task 0080 stage d, last in the default order;
# the textures of a cell are swapped a few a frame, on the main thread). Not yet: texture detail,
# point light shadows, volumetrics, cloud quality, history features (they cannot change at run time yet).
order = far objects, far terrain, texture mips

# `automatic`, or `manual` (steps are never undone by the controller).
restore = automatic

# Seconds between two steps.
dwell = 4

# Seconds the pressure must have been low before a step is undone.
restore dwell = 30

# Seconds between memory samples.
sample interval = 0.5

# One summary line at exit: time at each level, steps taken, the highest pressure.
report = false
