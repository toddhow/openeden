name: Build and test

# Triggers: see checks.yml (push to main and vulkan only, every pull request, a newer run cancels the older one).
on:
  push:
    branches: [main, vulkan]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    # Cold ccache: a local container build and test run took about 35 minutes (task 0022); the runner has 4 cores.
    timeout-minutes: 150

    steps:
    - uses: actions/checkout@v4

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building Dependencies
      run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ubuntu-24.04-gcc-${{ env.BUILD_TYPE }}
        max-size: 2000M

    - name: Configure
      run: >
        cmake .
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D BUILD_COMPONENTS_TESTS=ON
        -D BUILD_OPENMW_TESTS=ON
        -D BUILD_OPENCS_TESTS=ON
        -D "OPENMW_CXX_FLAGS=-Werror -Werror=implicit-fallthrough"
        -D CMAKE_C_COMPILER_LAUNCHER=ccache
        -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
        -D CMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        rc=0
        cmake --build . -- -j$(nproc) > build.log 2>&1 || rc=$?
        if [ "$rc" != 0 ]; then
          # The job log needs admin rights to read, so the first compiler errors go to a public annotation.
          errs=$( (grep -E 'error|Error [0-9]|FAILED|No rule' build.log || true) | head -12 | cut -c1-300 | tr '\n' '|')
          tailtext=$(tail -n 12 build.log | cut -c1-300 | tr '\n' '|')
          echo "::error::build failed ($rc): $errs tail: $tailtext"
        fi
        tail -n 5 build.log
        exit $rc

    - name: Run components tests
      run: ./components-tests --gtest_output=xml:test-results/components-tests.xml

    - name: Run Eden Archive tests (library, corpus, deterministic fuzz run)
      run: ./edenarchive-tests

    - name: Check the Eden Archive command-line tools
      run: bash edenarchive/tests/tools/check.sh ./edenpack ./edenunpack ./edenlist ./edenvalidate "${RUNNER_TEMP}/edenarchive-tools"

    - name: Run OpenMW tests
      run: ./openmw-tests --gtest_output=xml:test-results/openmw-tests.xml

    - name: Run Eden Studio tests
      run: ./eden-studio-tests --gtest_output=xml:test-results/eden-studio-tests.xml

    # The Lua API tests, against OpenMW's example suite at the revision pinned here (the same as .gitlab-ci.yml). The game
    # needs a Vulkan device, so a software one (lavapipe) runs under a virtual X server. Task 0022.
    - name: Install integration test dependencies
      run: >
        sudo apt-get install -y --no-install-recommends xvfb python3 python3-pip git-lfs mesa-vulkan-drivers libvulkan1
        && pip3 install --user --break-system-packages numpy matplotlib termtables click

    - name: Run integration tests
      env:
        EXAMPLE_SUITE_REVISION: a1ba6fc9d7315c2158ef4c60349fc4e71b7ca343
      run: |
        git lfs install
        mkdir example-suite
        cd example-suite
        git init
        git remote add origin https://gitlab.com/OpenMW/example-suite.git
        git fetch --depth=1 origin ${EXAMPLE_SUITE_REVISION}
        git checkout FETCH_HEAD
        cd ..
        xvfb-run --auto-servernum --server-args='-screen 0 640x480x24x60' \
          scripts/integration_tests.py --verbose --omw ./openmw --workdir integration_tests_output example-suite/

    # - name: Install
    #   shell: bash
    #   run: cmake --install .

    # - name: Create Artifact
    #   shell: bash
    #   working-directory: install
    #   run: |
    #     ls -laR
    #     7z a ../build_artifact.7z .

    # - name: Upload Artifact
    #   uses: actions/upload-artifact@v1
    #   with:
    #     path: ./build_artifact.7z
    #     name: build_artifact.7z

  # The MacOS job is left out: macOS is not a target until toddhow says so (guide, "Platforms"), and with Vulkan it would
  # need MoltenVK (decision 0002). Its scripts stay in CI/. Task 0022.

  Output-Envs:
    name: Read .env file and expose it as output
    runs-on: ubuntu-latest
    outputs:
      VCPKG_DEPS_TAG: ${{ env.VCPKG_DEPS_TAG }}
      BUILD_TYPE: ${{ env.BUILD_TYPE }}
    steps:
      - uses: actions/checkout@v4
      - run: cat "${{ github.workspace }}/CI/github.env" >> $GITHUB_ENV

  Windows:
    needs:
      - Output-Envs

    strategy:
      fail-fast: true
      matrix:
        image:
        - "2022"

    uses: ./.github/workflows/windows.yml
    with:
      image: ${{ matrix.image }}
      vcpkg-deps-tag: ${{ needs.Output-Envs.outputs.VCPKG_DEPS_TAG }}
      build-type: ${{ needs.Output-Envs.outputs.BUILD_TYPE }}
